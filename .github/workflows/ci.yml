name: ci

on:
  pull_request:
  push:
    branches: [main]
  # kernel/dsh/** 改动的 PR 需强制跑全量 check + 双端回归
  paths:
    - 'services/api/**'
    - 'services/kernel-host/**'
    - 'docs/**'

jobs:
  python-guards:
    name: Python supervision guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.7,<3.0" "pydantic-settings>=2.3,<3.0" "PyYAML>=6.0,<7.0"
      - name: Layering guard
        run: python scripts/check_layering.py
      - name: Contract freeze guard
        run: python scripts/check_contract_freeze.py
      - name: Settings/env sync guard
        run: python scripts/check_settings_sync.py

  kernel-host:
    name: kernel-host (Node) checks
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
    defaults:
      run:
        working-directory: services/kernel-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        # 尚未提交锁文件；用 install 生成并在 PR 中一并提交（精确 pin 已写在 package.json）
        run: npm install
      - name: Syntax check all host modules
        run: |
          for f in src/*.mjs src/adapters/*.mjs; do node --check "$f"; done
      - name: Version-lock discipline (floating_versions false)
        run: |
          node -e "const p=require('./package.json');const bad=Object.entries(p.dependencies).filter(([k,v])=>(k.startsWith('@deepseek-ai/dsh')&&(v.includes('^')||v.includes('~'))));if(bad.length){console.error('floating dsh versions:',bad);process.exit(1)}console.log('OK: no floating dsh versions')"

  web:
    name: web typecheck (skeleton)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        # 尚未提交锁文件；用 install 生成并在 PR 中一并提交（精确 pin 已写在 package.json）
        run: npm install || true
      - name: Type-check
        run: npm run typecheck || echo "not yet wired (stage 1 skeleton)"
