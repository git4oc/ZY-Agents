[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zy-agents"
version = "0.3.0"
description = "ZY-Agents 主服务（FastAPI）——阶段1内核闭环"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZY-Agents Contributors" }]
readme = "README.md"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    "motor>=3.4",
    "redis>=5.0",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pymongo>=4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "yaml>=0.2.5",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501", "B008"]
