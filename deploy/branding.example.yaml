# ===========================================================================
# ZY-Agents · 部署预置品牌样例（BRANDING_SEED_FILE）
# ---------------------------------------------------------------------------
# 供 bootstrap 在「品牌集合为空」时幂等 seed（docs/01 §4.8、00 §12.6）。
# 语义：
#   - 仅当 branding_settings 集合为空时写入；非空则跳过，绝不覆盖后台已改内容。
#   - 值按不可信输入处理（S-64）：主题色限 #RRGGBB、文案纯文本、链接仅 https。
#   - 本文件示例值会进入展示层，请替换为企业客户真实品牌。
# ===========================================================================

display_name: "示例企业科技有限公司"
short_name: "示例企业"

theme:
  # 仅接受 #RRGGBB，不接受任意 CSS 串
  primary: "#1f6feb"     # 主色
  accent:  "#0d9488"     # 强调色

# 页脚"由 ZY-Agents 提供技术支持"开关（默认开启，可关；私有时客户可关闭）
vendor_badge_enabled: true

