# ===========================================================================
# ZY-Agents · nginx 反向代理（裸进程形态）
# ---------------------------------------------------------------------------
# 单入口反代（SSE / WebSocket 必须 proxy_buffering off + 长超时）。
# 四个上游全部指向 localhost 端口（无容器 DNS 名）：
#   - api     :8000   主服务（FastAPI / uvicorn）
#   - web     :4173   web 构建产物静态服务（vite preview / 任意静态站）
#   - kernel  :8101   内核宿主（Node）—— 一般不经公网，仅保留为内网留口
#
# /internal/ 显式 deny：内核回调入口（HMAC 鉴权）严禁外露（docs/01 §7.3）。
# ===========================================================================

worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;

    # ---- SSE / WS 必须 ----
    proxy_buffering    off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_http_version  1.1;

    upstream api    { server 127.0.0.1:8000; }
    upstream web    { server 127.0.0.1:4173; }
    upstream kernel { server 127.0.0.1:8101; }

    # WS upgrade 映射：仅当客户端真的发了 Upgrade 才回 upgrade，
    # 否则回 close（普通请求保持可 keep-alive；无条件写 upgrade 会断掉复用）。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 3000;
        server_name _;

        # 预留企业部署的压缩/安全头扩展点
        client_max_body_size 20m;

        # 裸前缀（无后缀）
        location = /api {
            return 301 /api/;
        }

        # ------------------------------------------------------------------
        # API 主服务：前端统一 API 前缀 /api
        # ------------------------------------------------------------------
        # apps/web 全部调用都走 `/api/...`（生产环境不走 vite proxy），
        # 若无此 block，它们会落到 `location /` 被当成 SPA 路由并返回 HTML。
        #
        # 两条 rewrite 与 apps/web/vite.config.ts 的 `'/api'` 规则**逐条对齐**：
        #   /api/v1/<path> → 原样透传（后端真实前缀就是 /api/v1）
        #   /api/<path>     → /api/v1/<path>
        # 第二跳是**刻意**的：前端 `knowledgeSources.ts` 等调的是 `/api/knowledge/...`
        # （不带 v1），后端已把同一份知识库路由挂在 /api/ 与 /api/v1/ 两个前缀下，
        # 这里统一落到 /api/v1/。
        # ------------------------------------------------------------------
        location /api/ {
            rewrite ^/api/(?!v1/)(.*)$ /api/v1/$1 break;
            proxy_pass http://api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }

        # ★ 内核回调入口：严禁外露（双重防线；HMAC 鉴权只在主服务内部路径）
        location /internal/ {
            deny all;
            return 403;
        }

        # 本地 Agent WS 桥（upgrade 透传）
        location /localagent/ {
            proxy_pass http://api/localagent/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
        }

        # 内核宿主（默认不暴露；如需内网直连再放开）
        location /kernel/ {
            deny all;
            return 403;
        }

        # 前端 SPA
        location / {
            proxy_pass http://web/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
